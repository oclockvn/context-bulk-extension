name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      patch_number:
        description: 'Patch number for fixes (default: 0, increment for each fix at same EF Core version)'
        required: false
        type: string
        default: '0'

jobs:
  build-net8:
    name: Build and Publish .NET 8 Package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-net8-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-net8-
            ${{ runner.os }}-nuget-

      - name: Determine version
        id: version
        run: |
          set -e

          # Extract patch number (revision) from input or default to 0
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            PATCH_NUMBER="${{ github.event.inputs.patch_number }}"
            if [ -z "$PATCH_NUMBER" ]; then
              PATCH_NUMBER="0"
            fi
          else
            PATCH_NUMBER="0"
          fi

          # Validate patch number is numeric
          if ! echo "$PATCH_NUMBER" | grep -qE '^[0-9]+$'; then
            echo "Error: Invalid patch number: $PATCH_NUMBER"
            echo "Patch number must be a non-negative integer"
            exit 1
          fi

          # Use MSBuild to evaluate the Version property from SqlServer package
          VERSION=$(dotnet msbuild ContextBulkExtension.SqlServer/ContextBulkExtension.SqlServer.Net8.csproj \
            -getProperty:Version \
            -p:PatchNumber=$PATCH_NUMBER \
            -nologo)

          if [ -z "$VERSION" ]; then
            echo "Error: Could not determine version from project"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "PatchNumber=$PATCH_NUMBER" >> $GITHUB_OUTPUT
          echo "Determined version: $VERSION (via MSBuild)"
          echo "Patch number: $PATCH_NUMBER"

      - name: Build and pack projects
        run: |
          PATCH=${{ steps.version.outputs.PatchNumber }}
          for proj in \
            ContextBulkExtension.SqlServer/ContextBulkExtension.SqlServer.Net8.csproj \
            ContextBulkExtension.Postgres/ContextBulkExtension.Postgres.Net8.csproj
          do
            dotnet build "$proj" --configuration Release --no-incremental -p:PatchNumber=$PATCH
            dotnet pack "$proj" --configuration Release --no-build --output ./artifacts -p:PatchNumber=$PATCH
          done

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: oclockvn

      - name: Push package to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Generate job summary
        run: |
          PACKAGE_VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## Published .NET 8 NuGet Packages"
            echo ""
            echo "**Version:** \`${PACKAGE_VERSION}\`"
            echo "**Packages:** SqlServer, Postgres"
            echo "**Target:** .NET 8 / EF Core 8.x"
            echo "**Published:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } >> $GITHUB_STEP_SUMMARY

  build-net10:
    name: Build and Publish .NET 10 Package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-net10-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-net10-
            ${{ runner.os }}-nuget-

      - name: Determine version
        id: version
        run: |
          set -e

          # Extract patch number (revision) from input or default to 0
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            PATCH_NUMBER="${{ github.event.inputs.patch_number }}"
            if [ -z "$PATCH_NUMBER" ]; then
              PATCH_NUMBER="0"
            fi
          else
            PATCH_NUMBER="0"
          fi

          # Validate patch number is numeric
          if ! echo "$PATCH_NUMBER" | grep -qE '^[0-9]+$'; then
            echo "Error: Invalid patch number: $PATCH_NUMBER"
            echo "Patch number must be a non-negative integer"
            exit 1
          fi

          VERSION=$(dotnet msbuild ContextBulkExtension.SqlServer/ContextBulkExtension.SqlServer.csproj \
            -getProperty:Version \
            -p:PatchNumber=$PATCH_NUMBER \
            -nologo)

          if [ -z "$VERSION" ]; then
            echo "Error: Could not determine version from project"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "PatchNumber=$PATCH_NUMBER" >> $GITHUB_OUTPUT
          echo "Determined version: $VERSION (via MSBuild)"
          echo "Patch number: $PATCH_NUMBER"

      - name: Build and pack projects
        run: |
          PATCH=${{ steps.version.outputs.PatchNumber }}
          for proj in \
            ContextBulkExtension.SqlServer/ContextBulkExtension.SqlServer.csproj \
            ContextBulkExtension.Postgres/ContextBulkExtension.Postgres.csproj
          do
            dotnet build "$proj" --configuration Release --no-incremental -p:PatchNumber=$PATCH
            dotnet pack "$proj" --configuration Release --no-build --output ./artifacts -p:PatchNumber=$PATCH
          done

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: oclockvn

      - name: Push package to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Generate job summary
        run: |
          PACKAGE_VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## Published .NET 10 NuGet Packages"
            echo ""
            echo "**Version:** \`${PACKAGE_VERSION}\`"
            echo "**Packages:** SqlServer, Postgres"
            echo "**Target:** .NET 10 / EF Core 10.x"
            echo "**Published:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } >> $GITHUB_STEP_SUMMARY
